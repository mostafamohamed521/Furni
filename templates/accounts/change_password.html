{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
  <div class="hero hero-inner">
    <div class="container">
      <div class="row justify-content-between">
        <div class="col-lg-5"><div class="intro-excerpt"><h1>Change Password</h1></div></div>
      </div>
    </div>
  </div>
  <div class="untree_co-section before-footer-section tight-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="p-4 p-lg-5 border bg-white rounded">
            <form method="post" novalidate>
              {% csrf_token %}
              <div class="mb-3">
                <label class="text-black">Current Password</label>
                {{ form.old_password }}
              </div>
              <div class="mb-3">
                <label class="text-black">New Password</label>
                {{ form.new_password1 }}
              </div>
              <div class="mb-4">
                <label class="text-black">Confirm New Password</label>
                {{ form.new_password2 }}
              </div>
              <button type="submit" class="btn btn-black">Update Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
