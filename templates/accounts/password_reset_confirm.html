{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}
{% block content %}
  <div class="untree_co-section before-footer-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="p-4 p-lg-5 border bg-white rounded">
            {% if validlink %}
            <form method="post" novalidate>
              {% csrf_token %}
              <div class="mb-3">{{ form.new_password1 }}</div>
              <div class="mb-4">{{ form.new_password2 }}</div>
              <button type="submit" class="btn btn-black w-100 py-2">Set New Password</button>
            </form>
            {% else %}
            <p class="text-danger">رابط إعادة التعيين غير صالح، الرجاء طلب رابط جديد.</p>
            <a href="{% url 'accounts:password_reset' %}" class="btn btn-black">Request New Link</a>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
