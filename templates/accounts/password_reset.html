{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
  <div class="hero">
    <div class="container">
      <div class="row justify-content-between">
        <div class="col-lg-5"><div class="intro-excerpt"><h1>Reset Password</h1></div></div>
      </div>
    </div>
  </div>
  <div class="untree_co-section before-footer-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="p-4 p-lg-5 border bg-white rounded">
            <p class="text-muted mb-4">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور.</p>
            <form method="post" novalidate>
              {% csrf_token %}
              {{ form.email }}
              <button type="submit" class="btn btn-black w-100 mt-4 py-2">Send Reset Link</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
